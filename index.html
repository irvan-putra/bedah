<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vana - review itself in sections</title>
<meta name="description" content="Working review surface for irvan-putra/vana: the canvas reviews its own source - sections, exact file links at the pinned commit, review marks and findings kept in your browser.">
</head>
<body>
<div id="root"></div>
<script>
/* Pages replaces the whole site on each deploy, so a cached index.html can
   point at a bundle that no longer exists. Reload once with a cache-bust
   instead of sitting on a blank page. */
window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !sessionStorage.getItem('vana-reloaded')) {
        sessionStorage.setItem('vana-reloaded', '1');
        location.replace(location.pathname + '?r=' + Date.now());
    }
}, true);
</script>
<link rel="stylesheet" href="./app.css">
<script src="./app.js"></script>
</body>
</html>
